name: Courier Model

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  courier-model:
    name: courier-model
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, same pin as Decision Gate
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Test scenario coverage enforcement
        run: python3 -B models/courier/test_runner.py
      - name: Run the standalone model and record source hashes
        run: |
          python3 -B models/courier/run-model.py
          cat build/courier-model/model-results.json
