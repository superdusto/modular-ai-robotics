name: Decision Gate

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decision-gate:
    name: decision-gate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate every architecture decision
        run: python3 scripts/check_decisions.py --root .
      - name: Test the decision validator
        run: python3 -m unittest discover -s tests -p 'test_decision_gate.py' -v